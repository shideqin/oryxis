name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Build + test only: nothing here writes back to the repo, so the token
# gets the read scope the checkout needs and nothing else.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ORYXIS_SIGNALING_URL: ${{ secrets.ORYXIS_SIGNALING_URL }}
  ORYXIS_SIGNALING_TOKEN: ${{ secrets.ORYXIS_SIGNALING_TOKEN }}

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev libwayland-dev libxkbcommon-dev \
            lrzsz

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # --locked makes the committed Cargo.lock authoritative. Two crates
      # can carry ranges wide enough to land on DIFFERENT majors of the
      # same dependency and still both resolve (gpu-allocator asks for
      # `windows = ">=0.53, <=0.62"` while wgpu-hal pins 0.62 and passes
      # D3D12 types across the boundary), so a silent re-resolve breaks a
      # build nobody touched, on one platform only. Failing here beats
      # discovering it in a nightly.
      - name: Check
        run: cargo check --locked --all-targets

      - name: Test
        run: cargo test --locked --workspace

      - name: Clippy
        run: cargo clippy --locked --workspace -- -D warnings

  # The headless E2E suite (docs/HARNESS.md): the real app, real vault,
  # real subscriptions, no window. Its own job because it is long
  # (~10 s per file on this runner, a few minutes for the files that
  # drive a live shell through several resets) and because a red UI
  # test must be readable as "the UI moved", not mixed into the
  # compile gate.
  #
  # Three shards: every file runs on a freshly wiped sandbox, so the
  # list splits cleanly, and `--harness-shard i/3` takes every third
  # file of the name-sorted list (round-robin, so a file added or
  # removed moves the others by one slot at most). Nothing else is
  # shared between the shards; each builds the same binary from the
  # same cache. `fail-fast` is off so one red shard still lets the
  # others finish and report.
  #
  # It exists as a job at all because four committed `.ice` files had
  # silently rotted: the runner aborts on the FIRST failure, so each
  # stale test hid the next one, and nothing compiles these files, so a
  # UI change that invalidates one is invisible until somebody runs the
  # suite by hand. Three of the four broke in commits that had already
  # passed two rounds of diff review.
  #
  # No network by design (see the note in font-pack.ice), and every test
  # runs on a freshly wiped sandbox HOME, never the runner's own.
  e2e:
    name: Headless E2E (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev libwayland-dev libxkbcommon-dev \
            lrzsz tmux

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}

      - name: Build with the harness feature
        run: cargo build --locked -p oryxis-app --features harness

      # The sandbox HOME lives in the workspace, not under /tmp, purely so
      # the artifact glob below can name it. A `mktemp -d` sandbox forces
      # the glob to walk all of /tmp, where the runner keeps directories
      # this job cannot read (`/tmp/snap-private-tmp`), and the upload
      # step fails with EACCES after the suite already passed.
      # Run twice before calling it red. Some of these drive a REAL vault
      # unlock (Argon2id, deliberately slow) or a live PTY, and under a
      # loaded runner either can miss its assert by a hair; the runner
      # aborts on the FIRST failure, so one flake takes the whole suite
      # with it. A genuine break fails both attempts, so this costs a
      # rerun on a flake (of this shard only) and hides nothing.
      # `vault-lock-confirm` and `sftp-slow-click-rename` are the two
      # that have actually flaked.
      - name: Run the .ice suite
        run: |
          run_suite() {
            rm -rf "$RUNNER_TEMP/e2e-home"
            mkdir -p "$RUNNER_TEMP/e2e-home"
            target/debug/oryxis --harness-run crates/oryxis-app/tests/e2e \
              --harness-shard "${{ matrix.shard }}/3" \
              --home "$RUNNER_TEMP/e2e-home"
          }
          run_suite || {
            echo "::warning::the .ice suite failed once; retrying to tell a flake from a break"
            run_suite
          }

      # Canvas assertions are screenshot-based (text selectors cannot see
      # inside the terminal), so the shots are the only evidence of what
      # a failing run actually drew.
      # One artifact per shard: v4 artifacts are immutable, a second
      # upload under one name fails the job that gets there second.
      - name: Collect screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ matrix.shard }}
          # `--home X` puts the shots in `X/shots`; the glob stays broad
          # so a run that relocates them still uploads something.
          path: ${{ runner.temp }}/e2e-home/**/*.png
          if-no-files-found: ignore
          retention-days: 7
