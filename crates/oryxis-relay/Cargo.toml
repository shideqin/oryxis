[package]
name = "oryxis-relay"
version = "0.1.1"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Self-hostable signaling + relay server for Oryxis sync"

[[bin]]
name = "oryxis-relay"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
axum = { version = "0.8", features = ["macros"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
chrono = { workspace = true }
anyhow = "1"
ed25519-dalek = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
# The tests drive the server over plain `http://127.0.0.1`, so no TLS stack
# at all here. It used to ask for `rustls-tls`, which expands to
# `__rustls-ring` and kept `ring` in the lock for a client that never speaks
# TLS. Real deployments terminate TLS at the reverse proxy.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# Not for the tests' own traffic: a workspace build unifies reqwest's
# features, so the app's no-provider rustls lands in this build too and
# `Client::new` needs a provider installed. See `tests::client`.
rustls = { workspace = true }
tokio = { workspace = true }
