[package]
name = "oryxis-cloud-tencent-plugin"
version = "0.1.0"
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "oryxis-cloud-tencent-plugin"
path = "src/main.rs"

[dependencies]
# The Tencent Cloud provider, a thin wrapper over the `tccli` CLI. Like
# the gcp / azure plugins there is no SDK here; it stays a plugin (not
# in-process) for architectural consistency with `aws` / `k8s`.
oryxis-cloud-tencent = { workspace = true }
oryxis-cloud = { workspace = true }
oryxis-plugin-protocol = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
